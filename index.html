        // --- 執行分析路由 ---
        function executeAnalysis() {
            const out = document.getElementById('academic-output');
            out.innerHTML = '';
            
            try {
                switch(currentAnalysisType) {
                    case 'descriptive': runDescriptive(); break;
                    case 'item_stats': runItemStats(); break;
                    case 'means': runMeans(); break;
                    case 'ttest': runTtest(); break;
                    case 'anova': runAnova(); break;
                    case 'correlation': runCorrelation(); break;
                    case 'regression': runRegression(); break;
                }
                
                document.getElementById('results-container').classList.remove('hidden');
                document.getElementById('prof-feedback').classList.remove('hidden');
                
                // 新增：將此次產出的表格 HTML 推入歷史紀錄陣列中，供 Word 匯出使用
                if (out.innerHTML.trim() !== '') {
                    reportHistory.push(out.innerHTML);
                }
                
            } catch (error) {
                showModal('分析錯誤', '資料格式不符或運算過程發生錯誤，請確認選擇的變項屬性是否正確（例如將文字類別變數當作連續變數運算）。\n\n錯誤細節: ' + error.message);
                console.error(error);
            }
        }

        // --- 匯出成 Word 檔案 (符合南開福祉所與 APA 7th 規範) ---
        function exportToWord() {
            if (reportHistory.length === 0) {
                showModal('大衛林老師提醒', '同學，你目前還沒有執行任何統計分析喔！\n請先從左側選擇分析方法並執行，系統會自動在背景收集你的每一張報表，最後再一鍵匯出。');
                return;
            }

            // 建立符合 Word 讀取格式的 HTML 結構，並寫入版面設定 CSS
            const preHtml = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head>
                <meta charset='utf-8'>
                <title>論文統計分析報告</title>
                <style>
                    /* 嚴格遵照「南開科大長照系福祉所碩士學位論文格式製作教學簡報.pdf」設定 */
                    @page {
                        size: 21cm 29.7cm; /* A4 */
                        margin: 4.0cm 2.0cm 2.0cm 4.0cm; /* 上4 下2 左4 右2 */
                        mso-page-orientation: portrait;
                    }
                    body {
                        font-family: "Times New Roman", "DFKai-sb", "BiauKai", serif; /* 英文Times New Roman, 中文標楷體 */
                        font-size: 12pt;
                        line-height: 1.5; /* 內文 1.5 倍行高 */
                    }
                    .academic-table-title {
                        text-align: center;
                        font-weight: bold;
                        font-size: 12pt;
                        margin-top: 24pt;
                        margin-bottom: 12pt;
                        line-height: 1.0;
                    }
                    .academic-table {
                        width: 100%;
                        border-collapse: collapse;
                        text-align: center;
                        font-size: 12pt;
                        line-height: 1.0; /* 表格內文單行間距 */
                        margin-bottom: 24pt;
                    }
                    /* 三線表設計 */
                    .academic-table th {
                        border-top: 2px solid black;
                        border-bottom: 1px solid black;
                        padding: 6px;
                    }
                    .academic-table td {
                        padding: 6px;
                        border: none;
                    }
                    .academic-table tr:last-child td {
                        border-bottom: 2px solid black;
                    }
                </style>
            </head>
            <body>`;
            
            const postHtml = "</body></html>";
            
            // 將所有歷史分析結果用換行符號連接起來
            const content = reportHistory.join("<br><br>");
            const html = preHtml + content + postHtml;

            // 產生 Blob 檔案並觸發下載
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '碩士論文_統計分析與三線表結果.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showModal('匯出成功', '太棒了！所有的分析結果都已經幫你匯出成 Word 檔了。\n\n打開檔案後，你會發現頁面已經自動設定好「上4、下2、左4、右2」的邊界，字體是標楷體，且表格全都是完美的單行間距三線表。你只需將其內容貼上到你的論文正文中即可！');
        }

        }
